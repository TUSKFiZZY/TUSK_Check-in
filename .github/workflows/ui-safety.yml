name: UI safety checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate page scripts and markup references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');

          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((match, index) => {
            new vm.Script(match[1], { filename: `index.html inline script \${index + 1}` });
          });
          console.log(`JavaScript syntax passed (\${scripts.length} inline script block(s)).`);

          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
          if (duplicates.length) throw new Error('Duplicate HTML IDs: ' + duplicates.join(', '));

          const references = [...html.matchAll(/getElementById\(['"]([^'"]+)['"]\)/g)].map(match => match[1]);
          const missing = [...new Set(references.filter(id => !ids.includes(id)))];
          if (missing.length) throw new Error('JavaScript references missing HTML IDs: ' + missing.join(', '));

          console.log(`Markup checks passed (\${ids.length} unique IDs; \${references.length} static ID references).`);
          NODE
