<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171322">
<meta name="description" content="Daily checklist for Main and Alternate TUSKFiZZY accounts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>TUSKFiZZY Daily Tracker</title>
<style>
:root{color-scheme:dark;--bg:#100e18;--panel:#1b1826;--panel2:#211d30;--line:#39334c;--text:#f5f1ff;--muted:#aaa2bd;--accent:#b58cff;--accent2:#8d61e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#33224e 0%,var(--bg) 58%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{width:min(620px,100%);margin:auto;padding:24px 16px 40px}
header{text-align:center;padding:10px 0 20px}.brand{font-size:12px;letter-spacing:.22em;color:var(--accent);font-weight:800}.date{font-size:clamp(22px,6vw,30px);font-weight:800;margin:10px 0 4px}.sub{font-size:12px;color:var(--muted)}
.nav{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:15px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;border-radius:11px;font:inherit;font-size:13px;cursor:pointer}.btn:disabled{opacity:.35;cursor:default}
.summary,.account{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:17px;margin:13px 0}
.summarytop,.accounttop{display:flex;align-items:center;justify-content:space-between;gap:12px}.smallcap{font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:800}.total{font-size:27px;font-weight:850}.count{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:#39334b;overflow:hidden;margin-top:13px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),#d1aaff);border-radius:9px;transition:width .2s}
.account h2{font-size:18px;margin:4px 0 0}.tasks{display:grid;gap:9px;margin-top:16px}.task{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#171421;cursor:pointer;user-select:none}.task input{width:20px;height:20px;accent-color:var(--accent);margin:0}.task span{font-weight:650}.task.done span{text-decoration:line-through;color:var(--muted)}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 2px;color:var(--muted);font-size:11px}.danger{color:#ffb4c0}.install{display:none;width:100%;margin:0 0 12px;background:var(--accent2);border:0;font-weight:750}
@media(min-width:560px){main{padding-top:34px}.summary,.account{padding:20px}}
</style>
</head>
<body>
<main>
<header>
 <div class="brand">TUSKFiZZY</div>
 <div class="date" id="date">Loading date…</div>
 <div class="sub" id="daylabel">Daily checklist</div>
 <div class="nav">
  <button class="btn" id="prev" aria-label="Previous day">←</button>
  <button class="btn" id="today">Today</button>
  <button class="btn" id="next" aria-label="Next day">→</button>
 </div>
</header>
<button class="btn install" id="install">Install app</button>
<section class="summary">
 <div class="summarytop"><div><div class="smallcap">OVERALL PROGRESS</div><div class="count" id="overallcount">0 of 6 completed</div></div><div class="total" id="percent">0%</div></div>
 <div class="bar"><div class="fill" id="overallbar"></div></div>
</section>
<section class="account">
 <div class="accounttop"><div><div class="smallcap">ACCOUNT 01</div><h2>Main TUSKFiZZY</h2></div><div class="count" id="maincount">0/3</div></div>
 <div class="tasks" id="main"></div><div class="bar"><div class="fill" id="mainbar"></div></div>
</section>
<section class="account">
 <div class="accounttop"><div><div class="smallcap">ACCOUNT 02</div><h2>Alternate TUSKFiZZY</h2></div><div class="count" id="altcount">0/3</div></div>
 <div class="tasks" id="alt"></div><div class="bar"><div class="fill" id="altbar"></div></div>
</section>
<div class="footer"><span id="saved">Saved on this device</span><button class="btn danger" id="reset">Reset this day ↺</button></div>
</main>
<script>
(()=>{
const tasks=['Login','Commission','Resin'],storageKey='tuskfizzy_daily_v1';
let selected=new Date();selected.setHours(12,0,0,0);
let records={};try{records=JSON.parse(localStorage.getItem(storageKey)||'{}')||{}}catch(e){}
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>{let d=new Date();d.setHours(12,0,0,0);return d};
const fresh=()=>({main:[false,false,false],alt:[false,false,false]});
const current=()=>records[key(selected)]||fresh();
function save(){try{localStorage.setItem(storageKey,JSON.stringify(records));document.getElementById('saved').textContent='✓ Saved on this device'}catch(e){document.getElementById('saved').textContent='Could not save — storage unavailable'}}
function render(){
 const k=key(selected),d=current(),todayKey=key(today());
 document.getElementById('date').textContent=selected.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
 document.getElementById('daylabel').textContent=k===todayKey?"Today's checklist":k<todayKey?'Previous day':'Future date';
 document.getElementById('next').disabled=k>=todayKey;
 for(const a of ['main','alt']){
  const host=document.getElementById(a);host.replaceChildren();
  tasks.forEach((task,i)=>{
   const label=document.createElement('label');label.className='task'+(d[a][i]?' done':'');
   const input=document.createElement('input');input.type='checkbox';input.checked=!!d[a][i];
   input.addEventListener('change',()=>{if(!records[k])records[k]=fresh();records[k][a][i]=input.checked;save();render()});
   const span=document.createElement('span');span.textContent=task;label.append(input,span);host.append(label);
  });
  const n=d[a].filter(Boolean).length;document.getElementById(a+'count').textContent=n+'/3';document.getElementById(a+'bar').style.width=(n/3*100)+'%';
 }
 const n=d.main.filter(Boolean).length+d.alt.filter(Boolean).length;
 document.getElementById('overallcount').textContent=n+' of 6 completed';
 document.getElementById('percent').textContent=Math.round(n/6*100)+'%';
 document.getElementById('overallbar').style.width=(n/6*100)+'%';
}
document.getElementById('prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()};
document.getElementById('next').onclick=()=>{if(key(selected)<key(today())){selected.setDate(selected.getDate()+1);render()}};
document.getElementById('today').onclick=()=>{selected=today();render()};
document.getElementById('reset').onclick=()=>{if(confirm('Reset all six checkboxes for '+key(selected)+'?')){delete records[key(selected)];save();render()}};
render();
setInterval(()=>{if(key(selected)===key(today()))render()},30000);
let installEvent;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;document.getElementById('install').style.display='block'});
document.getElementById('install').onclick=async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;installEvent=null;document.getElementById('install').style.display='none'};
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
