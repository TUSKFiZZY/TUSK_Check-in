<html lang="en">
<head>

<title>TUSKFiZZY Daily Tracker</title>
<style>
:root{color-scheme:dark;--bg:#100e18;--panel:#1b1826;--panel2:#211d30;--line:#39334c;--text:#f5f1ff;--muted:#aaa2bd;--accent:#b58cff;--accent2:#8d61e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#33224e 0%,var(--bg) 58%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{width:min(620px,100%);margin:auto;padding:24px 16px 40px}
header{text-align:center;padding:10px 0 20px}body.genshin-active .date,body.genshin-active .sub,body.genshin-active .nav,body.genshin-active .month-toggle,body.genshin-active .install,body.genshin-active .summary,body.genshin-active .month-view,body.genshin-active #accounts,body.genshin-active #addAccount,body.genshin-active #addGenshinHome,body.genshin-active .footer{display:none!important}#addGenshinHome{width:100%;margin:0 0 12px;border-style:dashed;color:var(--accent);font-weight:750;padding:13px}.genshin-panel{min-height:230px}header{position:relative}.more-menu-wrap{position:absolute;right:0;top:2px;z-index:20}.more-btn{width:38px;height:38px;padding:0;font-size:23px;line-height:1;border-radius:12px}.more-menu{position:absolute;right:0;top:44px;width:220px;padding:7px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 35px #0009;text-align:left}.more-menu[hidden]{display:none}.more-menu button{display:block;width:100%;padding:11px 10px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;font:inherit;font-size:13px;cursor:pointer}.more-menu button:hover{background:#ffffff12}.genshin-panel{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:17px;margin:13px 0}.genshin-panel[hidden]{display:none}.genshin-panel h2{font-size:18px;margin:0 0 8px}.genshin-panel p{font-size:12px;color:var(--muted);line-height:1.55}.genshin-panel label{display:block;color:var(--muted);font-size:11px;margin:10px 0 5px}.genshin-panel input,.genshin-panel select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#171421;color:var(--text);font:inherit;font-size:13px}.genshin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.genshin-account-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.genshin-account-row:last-child{border-bottom:0}.genshin-account-row strong{font-size:13px}.genshin-account-row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.genshin-note{padding:12px;border:1px dashed var(--line);border-radius:11px;color:var(--muted);font-size:12px;line-height:1.55;margin-top:12px}.brand{font-size:12px;letter-spacing:.22em;color:var(--accent);font-weight:800}.home-app-icon{display:block;width:68px;height:68px;object-fit:cover;object-position:center;margin:10px auto 4px;border-radius: 12px}.date{font-size:clamp(22px,6vw,30px);font-weight:800;margin:10px 0 4px}.sub{font-size:12px;color:var(--muted)}
.nav{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:15px}.month-toggle{margin-top:12px}.month-view{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:15px;margin:13px 0}.month-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.month-title{font-weight:800}.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.month-weekday{text-align:center;color:var(--muted);font-size:10px;padding:5px 0}.month-day{position:relative;min-width:0;min-height:72px;padding:6px 4px;border:1px solid var(--line);border-radius:9px;background:#171421;color:var(--text);text-align:left;cursor:pointer}.month-day.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.month-day.today{box-shadow:inset 0 0 0 1px var(--accent)}.month-day.completed{background:#173326;border-color:#28734b}.month-day.incomplete{background:#3a2028;border-color:#8b3d4b}.month-day.future{background:#171421;color:#777184;opacity:.55;cursor:not-allowed}.month-day.empty{visibility:hidden}.month-day .month-num{display:block;width:100%;font-size:14px;font-weight:900;text-align:center;margin:2px 0 5px;line-height:1.25}.month-status{position:absolute;right:5px;top:4px;font-size:13px;font-weight:900;line-height:1}.month-day.completed .month-status{color:#69e39a}.month-day.incomplete .month-status{color:#ff8292}.month-progress{font-size:9px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.month-day.future .month-progress{color:#777184}.month-legend{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.5}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;border-radius:11px;font:inherit;font-size:13px;cursor:pointer}.btn:disabled{opacity:.35;cursor:default}
.summary,.account{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:17px;margin:13px 0}
.summarytop,.accounttop{display:flex;align-items:center;justify-content:space-between;gap:12px}.smallcap{font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:800}.total{font-size:27px;font-weight:850}.count{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:#39334b;overflow:hidden;margin-top:13px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),#d1aaff);border-radius:9px;transition:width .2s}
.account h2{font-size:18px;margin:4px 0 0}.tasks{display:grid;gap:9px;margin-top:16px}.task{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#171421;cursor:pointer;user-select:none}.task input{width:20px;height:20px;accent-color:var(--accent);margin:0}.task span{font-weight:650}.task.done span{text-decoration:line-through;color:var(--muted)}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 2px;color:var(--muted);font-size:11px}.danger{color:#ffb4c0}.install{display:none;width:auto;margin:14px auto 8px;padding:8px 16px;background:var(--accent2);border:0;font-weight:750}
.accounttop{align-items:center}.identity{display:flex;align-items:center;gap:12px;min-width:0}.portrait{width:66px;height:66px;flex:0 0 66px;border-radius:15px;object-fit:cover;background:linear-gradient(145deg,#574078,#241d34);border:1px solid var(--line)}.portrait-fallback{display:grid;place-items:center;font-size:23px;font-weight:850;color:#e7d7ff}.accountmeta{min-width:0}.accountmeta h2{overflow-wrap:anywhere}.account-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}.account-actions .btn{padding:6px 9px;font-size:11px}.add-account{width:100%;margin:5px 0 12px;border-style:dashed;color:var(--accent);font-weight:750;padding:13px}.empty-note{color:var(--muted);font-size:12px;margin:12px 2px 0}.profile-dialog{width:min(420px,calc(100% - 28px));border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--panel2);color:var(--text);box-shadow:0 20px 70px #0009}.profile-dialog::backdrop{background:#080610bb;backdrop-filter:blur(3px)}.profile-dialog h2{font-size:18px;margin:0 0 14px}.profile-dialog label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}.profile-dialog input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#171421;color:var(--text);font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.dialog-actions .primary{background:var(--accent2);border-color:var(--accent2);font-weight:750}.empty-accounts{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);margin:14px 0}
@media(min-width:560px){main{padding-top:34px}.summary,.account{padding:20px}}
.account-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:16px;align-items:start}.account-body .tasks{margin-top:0}.hoyo-box{padding:12px;border:1px solid var(--line);border-radius:12px;background:#171421;min-width:0}.hoyo-box label{display:block;color:var(--muted);font-size:11px;margin:8px 0 4px}.hoyo-box input,.hoyo-box select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font:inherit;font-size:13px}.hoyo-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.hoyo-actions .btn{padding:7px 9px;font-size:11px}.hoyo-status{font-size:11px;color:var(--muted);margin-top:8px;white-space:pre-wrap}.hoyo-data{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.hoyo-stat{padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--panel);min-width:0}.hoyo-stat strong{display:block;font-size:17px;line-height:1.3}.hoyo-stat span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.hoyo-empty{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5}@media(max-width:520px){.account-body{grid-template-columns:1fr}}.footer-brand-icon{display:block;width:30px;height:30px;object-fit:cover;border-radius:7px;border:1px solid var(--line);flex:0 0 30px}</style>
</head>
<body>
<main>
<header>
 <div class="more-menu-wrap">
  <button class="btn more-btn" id="moreMenuButton" aria-label="More options" aria-haspopup="true" aria-expanded="false">⋮</button>
  <div class="more-menu" id="moreMenu" hidden>
   <button type="button" data-gview="home">Home</button>
   <button type="button" data-gview="profile">Genshin Profile</button>
   <button type="button" data-gview="achievements">Achievements</button>
   <button type="button" data-gview="wishes">Wish History &amp; Pity</button>
   <button type="button" data-gview="accounts">Manage Genshin Accounts</button>
  </div>
 </div>
 <div class="brand">TUSKFiZZY</div>
 <img class="home-app-icon" src="https://b2287888.assetcdn.net/2.0/2287888/wp-content/uploads/2025/04/abstract-blue-purple-wallpaper.jpg?lossy=1&strip=1&webp=1" alt="TUSKFiZZY square icon">
 <div class="date" id="date">Loading date…</div>
 <div class="sub" id="clock" aria-live="off">--:--:--</div>
 <div class="sub" id="daylabel">Daily checklist</div>
 <div class="nav">
  <button class="btn" id="prev" aria-label="Previous day">←</button>
  <button class="btn" id="today">Today</button>
  <button class="btn" id="next" aria-label="Next day">→</button>
 </div>
 <button class="btn month-toggle" id="monthToggle">Month overview</button>
</header>
<section class="genshin-panel" id="genshinPanel" hidden>
 <div class="summarytop"><div><div class="smallcap">GENSHIN IMPACT</div><h2 id="genshinTitle">Genshin Profile</h2></div><button class="btn" id="closeGenshinPanel" type="button" aria-label="Close">✕</button></div>
 <div id="genshinPanelBody"></div>
</section>
<section class="summary">
 <div class="summarytop"><div><div class="smallcap">OVERALL PROGRESS</div><div class="count" id="overallcount">0 of 6 completed</div></div><div class="total" id="percent">0%</div></div>
 <div class="bar"><div class="fill" id="overallbar"></div></div>
</section>
<section class="month-view" id="monthView" hidden></section>
<div id="accounts"></div>
<button class="btn add-account" id="addAccount">＋ Add account</button>
<button class="btn" id="addGenshinHome" type="button">＋ Add Genshin Account</button>
<dialog class="profile-dialog" id="profileDialog">
 <form id="profileForm">
  <h2 id="profileDialogTitle">Add account</h2>
  <label for="profileName">Account name</label>
  <input id="profileName" type="text" maxlength="40" placeholder="Enter account name" required>
  <div class="dialog-actions">
   <button class="btn" type="button" id="profileCancel">Cancel</button>
   <button class="btn primary" type="submit" id="profileSave">Save account</button>
  </div>
 </form>
</dialog>

<button class="btn install" id="install">Install app</button>
<div class="footer"><span id="saved">Saved on this device</span><img class="footer-brand-icon" src="https://i.imgur.com/PpeGWFI.png" alt="TUSKFiZZY icon" loading="lazy"><button class="btn danger" id="reset">Reset this day ↺</button></div>
</main>
<script>
(()=>{
const genshinAccountsKey='tuskfizzy_genshin_accounts_v1',genshinSelectedKey='tuskfizzy_selected_genshin_v1';
let genshinAccounts=[],selectedGenshinId=localStorage.getItem(genshinSelectedKey)||'',genshinView='profile';
try{genshinAccounts=JSON.parse(localStorage.getItem(genshinAccountsKey)||'[]')||[]}catch(e){}
function saveGenshinAccounts(){localStorage.setItem(genshinAccountsKey,JSON.stringify(genshinAccounts));if(selectedGenshinId)localStorage.setItem(genshinSelectedKey,selectedGenshinId);else localStorage.removeItem(genshinSelectedKey)}
function selectedGenshin(){return genshinAccounts.find(a=>a.id===selectedGenshinId)||null}
async function refreshGenshinAccount(accountItem,statusEl){
  if(!accountItem.uid){statusEl.textContent='Add this account UID first.';return}
  if(!window.tuskfizzy||typeof window.tuskfizzy.getDailyNote!=='function'){
   statusEl.textContent='Genshin connection is available in the TUSKFiZZY Windows desktop app. Open the app to connect.';
   return;
  }
  statusEl.textContent='Checking HoYoLAB connection…';
  try{
   const data=await window.tuskfizzy.getDailyNote(accountItem.id,accountItem.uid,accountItem.server||'os_asia');
   accountItem.dailyNote=data;
   accountItem.lastConnected=Date.now();
   saveGenshinAccounts();
   statusEl.textContent='Connected · live data refreshed';
   showGenshinView(genshinView);
  }catch(error){
   statusEl.textContent=error&&error.message?error.message:'Could not connect. Sign in to HoYoLAB and try again.';
  }
 }
 async function openGenshinLogin(accountItem,statusEl){
  if(!window.tuskfizzy||typeof window.tuskfizzy.connectHoYoLab!=='function'){
   statusEl.textContent='Open the TUSKFiZZY Windows desktop app to connect this account.';
   return;
  }
  try{
   await window.tuskfizzy.connectHoYoLab(accountItem.id);
   statusEl.textContent='HoYoLAB opened in a separate window. Sign in there, then return and press Refresh.';
  }catch(error){statusEl.textContent=error&&error.message?error.message:'Could not open HoYoLAB.'}
 }
 function showGenshinView(view){
  genshinView=view;
  document.getElementById('moreMenu').hidden=true;
  document.getElementById('moreMenuButton').setAttribute('aria-expanded','false');
  const panel=document.getElementById('genshinPanel'),body=document.getElementById('genshinPanelBody'),title=document.getElementById('genshinTitle');
  const home=view==='home';
  document.body.classList.toggle('genshin-active',!home);
  panel.hidden=home;
  if(home)return;
  body.replaceChildren();
  const account=selectedGenshin();
  const addText=(tag,cls,txt,parent=body)=>{const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=txt;parent.append(el);return el};
  const manageButton=()=>{const button=document.createElement('button');button.className='btn';button.type='button';button.textContent='Manage Genshin Accounts';button.onclick=()=>showGenshinView('accounts');body.append(button)};
  if(view==='accounts'){
   title.textContent='Manage Genshin Accounts';
   addText('p','','Add your Genshin UID, then sign in to HoYoLAB using the separate desktop window.');
   const add=document.createElement('button');add.className='btn primary';add.textContent='＋ Add Genshin account';
   add.onclick=()=>renderGenshinForm();
   body.append(add);
   if(!genshinAccounts.length)addText('div','genshin-note','No Genshin accounts added yet.');
   function renderGenshinForm(existing=null){
    const old=body.querySelector('.genshin-form');if(old)old.remove();
    const form=addText('form','genshin-panel genshin-form','');
    addText('h2','',existing?'Edit Genshin account':'Add Genshin account',form);
    const makeField=(labelText,type,value,placeholder)=>{
     const label=addText('label','',labelText,form);
     const input=document.createElement('input');input.type=type;input.value=value||'';input.placeholder=placeholder||'';label.append(input);return input;
    };
    const name=makeField('Account name','text',existing?.name||'','e.g. Main account');name.required=true;name.maxLength=40;
    const uid=makeField('Genshin UID','text',existing?.uid||'','Enter your 9-digit UID');uid.inputMode='numeric';uid.maxLength=10;
    const serverLabel=addText('label','','Server',form);
    const server=document.createElement('select');
    [['os_asia','Asia'],['os_usa','America'],['os_euro','Europe'],['os_cht','TW, HK, MO']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;server.append(option)});
    server.value=existing?.server||'os_asia';serverLabel.append(server);
    const actions=addText('div','genshin-actions','',form);
    const save=document.createElement('button');save.type='submit';save.className='btn primary';save.textContent='Save account';actions.append(save);
    const cancel=document.createElement('button');cancel.type='button';cancel.className='btn';cancel.textContent='Cancel';cancel.onclick=()=>form.remove();actions.append(cancel);
    form.onsubmit=e=>{
     e.preventDefault();
     const cleanName=name.value.trim(),cleanUid=uid.value.trim();
     if(!cleanName)return;
     if(cleanUid&&!/^\\d{8,10}$/.test(cleanUid)){uid.setCustomValidity('Enter a valid Genshin UID.');uid.reportValidity();return}
     uid.setCustomValidity('');
     if(existing){existing.name=cleanName;existing.uid=cleanUid;existing.server=server.value}
     else{
      const id='genshin_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
      genshinAccounts.push({id,name:cleanName,uid:cleanUid,server:server.value});
      selectedGenshinId=id;
     }
     saveGenshinAccounts();showGenshinView('accounts');
    };
   }
   genshinAccounts.forEach(accountItem=>{
    const row=addText('div','genshin-account-row',''),info=addText('div','','',row);
    addText('strong','',accountItem.name,info);
    addText('small','',(accountItem.uid?'UID '+accountItem.uid+' · ':'UID not set · ')+(accountItem.server||'os_asia')+(accountItem.lastConnected?' · Connected before':''),info);
    const controls=addText('div','genshin-actions','',row);
    const choose=document.createElement('button');choose.className='btn';choose.textContent=accountItem.id===selectedGenshinId?'Selected':'Switch';
    choose.onclick=()=>{selectedGenshinId=accountItem.id;saveGenshinAccounts();showGenshinView('accounts')};controls.append(choose);
    const connect=document.createElement('button');connect.className='btn';connect.textContent='Connect HoYoLAB';
    const status=addText('small','genshin-note','',info);
    connect.onclick=()=>openGenshinLogin(accountItem,status);controls.append(connect);
    const refresh=document.createElement('button');refresh.className='btn';refresh.textContent='Refresh';
    refresh.disabled=!accountItem.uid;refresh.onclick=()=>refreshGenshinAccount(accountItem,status);controls.append(refresh);
    const edit=document.createElement('button');edit.className='btn';edit.textContent='Edit';
    edit.onclick=()=>renderGenshinForm(accountItem);controls.append(edit);
    const remove=document.createElement('button');remove.className='btn danger';remove.textContent='Remove';
    remove.onclick=()=>{if(confirm('Remove '+accountItem.name+' from Genshin accounts?')){genshinAccounts=genshinAccounts.filter(x=>x.id!==accountItem.id);if(selectedGenshinId===accountItem.id)selectedGenshinId=genshinAccounts[0]?.id||'';saveGenshinAccounts();showGenshinView('accounts')}};controls.append(remove);
   });
   return;
  }
  title.textContent=view==='achievements'?'Achievements':view==='wishes'?'Wish History & Pity':'Genshin Profile';
  if(!account){addText('div','genshin-note','Add a Genshin account first to view this section.');manageButton();return}
  if(view==='profile'){
   addText('p','','Selected Genshin account: '+account.name);
   addText('div','genshin-note','UID: '+(account.uid||'Not added')+'\\nServer: '+(account.server||'Asia')+'\\n\\n'+(account.dailyNote?'Live HoYoLAB data · updated '+new Date(account.dailyNote.fetchedAt).toLocaleString():'Not connected yet. Open HoYoLAB and sign in to connect.'));
   if(account.dailyNote){
    const stats=addText('div','hoyo-data','');
    [[account.dailyNote.resin+'/'+account.dailyNote.maxResin,'Resin'],[account.dailyNote.commissions+'/'+account.dailyNote.totalCommissions,'Commissions'],[account.dailyNote.expeditions+'/'+account.dailyNote.maxExpeditions,'Expeditions'],[account.dailyNote.extraRewardClaimed?'Claimed':'Not claimed','Commission bonus']].forEach(([value,label])=>{const item=addText('div','hoyo-stat','',stats);addText('strong','',value,item);addText('span','',label,item)});
   }
   const status=addText('div','genshin-note','');
   const actions=addText('div','genshin-actions','');
   const connect=document.createElement('button');connect.className='btn';connect.textContent='Connect HoYoLAB';connect.onclick=()=>openGenshinLogin(account,status);actions.append(connect);
   const refresh=document.createElement('button');refresh.className='btn primary';refresh.textContent='Refresh Genshin data';refresh.disabled=!account.uid;refresh.onclick=()=>refreshGenshinAccount(account,status);actions.append(refresh);
  }else if(view==='achievements'){
   addText('div','genshin-note','Selected account: '+account.name+(account.uid?' · UID '+account.uid:'')+'\\n\\nAchievement data is not connected yet.');
  }else if(view==='wishes'){
   addText('div','genshin-note','Selected account: '+account.name+(account.uid?' · UID '+account.uid:'')+'\\n\\nWish History\\nWish history is not connected yet. UIGF import support can be added separately.\\n\\nPity\\nPity counts and guarantee status will appear here after wish history is imported.');
  }
  const actions=addText('div','genshin-actions','');
  const switcher=document.createElement('button');switcher.className='btn';switcher.textContent='Switch Genshin Account';switcher.onclick=()=>showGenshinView('accounts');actions.append(switcher);
  manageButton();
 }
 document.getElementById('moreMenuButton').setAttribute('aria-expanded','false');
 const panel=document.getElementById('genshinPanel'),body=document.getElementById('genshinPanelBody'),title=document.getElementById('genshinTitle');
 const home=view==='home';
 document.body.classList.toggle('genshin-active',!home);
 panel.hidden=home;
 if(home)return;
 body.replaceChildren();
 const account=selectedGenshin();
 const addText=(tag,cls,txt,parent=body)=>{const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=txt;parent.append(el);return el};
 const manageButton=()=>{const button=document.createElement('button');button.className='btn';button.type='button';button.textContent='Manage Genshin Account';button.onclick=()=>showGenshinView('accounts');body.append(button)};
 if(view==='accounts'){
  title.textContent='Manage Genshin Accounts';
  addText('p','','Manage your Genshin accounts here. They are separate from daily tracker profiles.');
  const add=document.createElement('button');add.className='btn primary';add.textContent='＋ Add Genshin account';
  add.onclick=()=>{const name=prompt('Enter a name for this Genshin account:');if(!name||!name.trim())return;const uid=prompt('Enter the Genshin UID (optional):')||'';const id='genshin_'+Date.now().toString(36);genshinAccounts.push({id,name:name.trim(),uid:uid.trim(),server:'os_asia'});selectedGenshinId=id;saveGenshinAccounts();showGenshinView('accounts')};
  body.append(add);
  if(!genshinAccounts.length)addText('div','genshin-note','No Genshin accounts added yet. Add one to get started.');
  genshinAccounts.forEach(accountItem=>{
   const row=addText('div','genshin-account-row',''),info=addText('div','','',row);
   addText('strong','',accountItem.name,info);
   addText('small','',(accountItem.uid?'UID '+accountItem.uid+' · ':'')+(accountItem.server||'Asia'),info);
   const controls=addText('div','genshin-actions','',row);
   const choose=document.createElement('button');choose.className='btn';choose.textContent=accountItem.id===selectedGenshinId?'Selected':'Switch';
   choose.onclick=()=>{selectedGenshinId=accountItem.id;saveGenshinAccounts();showGenshinView('accounts')};controls.append(choose);
   const edit=document.createElement('button');edit.className='btn';edit.textContent='Edit';
   edit.onclick=()=>{const name=prompt('Account name:',accountItem.name);if(name&&name.trim())accountItem.name=name.trim();const uid=prompt('Genshin UID:',accountItem.uid||'');if(uid!==null)accountItem.uid=uid.trim();const server=prompt('Server: os_asia, os_usa, os_euro, or os_cht',accountItem.server||'os_asia');if(server)accountItem.server=server;saveGenshinAccounts();showGenshinView('accounts')};controls.append(edit);
   const remove=document.createElement('button');remove.className='btn danger';remove.textContent='Remove';
   remove.onclick=()=>{if(confirm('Remove '+accountItem.name+' from Genshin accounts?')){genshinAccounts=genshinAccounts.filter(x=>x.id!==accountItem.id);if(selectedGenshinId===accountItem.id)selectedGenshinId=genshinAccounts[0]?.id||'';saveGenshinAccounts();showGenshinView('accounts')}};controls.append(remove);
  });
  return;
 }
 title.textContent=view==='achievements'?'Achievements':view==='wishes'?'Wish History & Pity':'Genshin Profile';
 if(!account){addText('div','genshin-note','Add a Genshin account first to view this section.');manageButton();return}
 if(view==='profile'){
  addText('p','','Selected Genshin account: '+account.name);
  addText('div','genshin-note','UID: '+(account.uid||'Not added')+'\nServer: '+(account.server||'Asia')+'\n\nLive profile details are not connected yet.');
 }else if(view==='achievements'){
  addText('div','genshin-note','Selected account: '+account.name+(account.uid?' · UID '+account.uid:'')+'\n\nAchievement data is not connected yet.');
 }else if(view==='wishes'){
  addText('div','genshin-note','Selected account: '+account.name+(account.uid?' · UID '+account.uid:'')+'\n\nWish History\nWish history is not connected yet. UIGF import support can be added separately.\n\nPity\nPity counts and guarantee status will appear here after wish history is imported.');
 }
 const actions=addText('div','genshin-actions','');
 const switcher=document.createElement('button');switcher.className='btn';switcher.textContent='Switch Genshin Account';switcher.onclick=()=>showGenshinView('accounts');actions.append(switcher);
 manageButton();
}
document.getElementById('moreMenuButton').addEventListener('click',()=>{const menu=document.getElementById('moreMenu');menu.hidden=!menu.hidden;document.getElementById('moreMenuButton').setAttribute('aria-expanded',String(!menu.hidden))});
document.querySelectorAll('[data-gview]').forEach(button=>button.addEventListener('click',()=>showGenshinView(button.dataset.gview)));
document.getElementById('closeGenshinPanel').onclick=()=>showGenshinView('home');
document.getElementById('addGenshinHome').onclick=()=>showGenshinView('accounts');
document.addEventListener('click',event=>{const wrap=document.querySelector('.more-menu-wrap');if(wrap&&!wrap.contains(event.target)){document.getElementById('moreMenu').hidden=true;document.getElementById('moreMenuButton').setAttribute('aria-expanded','false')}});
const tasks=['Login','Commission','Resin'];
const accountsKey='tuskfizzy_accounts_v1',recordsKey='tuskfizzy_daily_multi_v1',legacyKey='tuskfizzy_daily_v1';
let selected=new Date();selected.setHours(12,0,0,0);
let monthCursor=new Date(selected.getFullYear(),selected.getMonth(),1,12);
let showMonth=false;
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>{let d=new Date();d.setHours(12,0,0,0);return d};
function updateClock(){const el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
let accounts=[],records={};
try{accounts=JSON.parse(localStorage.getItem(accountsKey)||'null')||[]}catch(e){}
try{records=JSON.parse(localStorage.getItem(recordsKey)||'{}')||{}}catch(e){}
// Remove the old built-in Main/Alternate profiles from existing installations.
const oldDefaultIds=['main','alt'];
const hadOldDefaults=accounts.some(a=>oldDefaultIds.includes(a.id))||Object.values(records).some(day=>day&&oldDefaultIds.some(id=>Object.prototype.hasOwnProperty.call(day,id)));
accounts=accounts.filter(a=>!oldDefaultIds.includes(a.id));
Object.values(records).forEach(day=>{if(day&&typeof day==='object')oldDefaultIds.forEach(id=>delete day[id])});
if(hadOldDefaults){try{localStorage.setItem(accountsKey,JSON.stringify(accounts));localStorage.setItem(recordsKey,JSON.stringify(records));localStorage.removeItem(legacyKey)}catch(e){}}

function saveAll(){try{localStorage.setItem(accountsKey,JSON.stringify(accounts));localStorage.setItem(recordsKey,JSON.stringify(records));document.getElementById('saved').textContent='✓ Saved on this device'}catch(e){document.getElementById('saved').textContent='Could not save — storage unavailable'}}
const fresh=()=>Object.fromEntries(accounts.map(a=>[a.id,[false,false,false]]));
function current(){let r=records[key(selected)];if(!r){r=fresh();}accounts.forEach(a=>{if(!Array.isArray(r[a.id]))r[a.id]=[false,false,false]});return r}
function makePortrait(src,name){
 const img=document.createElement('img');img.className='portrait';img.alt=name+' portrait';img.src=src||'';img.onerror=()=>{const fallback=document.createElement('div');fallback.className='portrait portrait-fallback';fallback.textContent=(name.trim()[0]||'?').toUpperCase();img.replaceWith(fallback)};return img;
}
function renderMonth(){
 const panel=document.getElementById('monthView');
 panel.replaceChildren();
 panel.hidden=!showMonth;
 document.getElementById('accounts').hidden=showMonth;
 document.getElementById('addAccount').hidden=showMonth;
 document.querySelector('.summary').hidden=showMonth;
 document.querySelector('.footer').hidden=showMonth;
 document.getElementById('monthToggle').textContent=showMonth?'Day view':'Month overview';
 if(!showMonth)return;
 const head=document.createElement('div');head.className='month-head';
 const prev=document.createElement('button');prev.className='btn';prev.textContent='←';prev.onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()-1);render()};
 const title=document.createElement('div');title.className='month-title';title.textContent=monthCursor.toLocaleDateString(undefined,{month:'long',year:'numeric'});
 const next=document.createElement('button');next.className='btn';next.textContent='→';next.onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()+1);render()};
 head.append(prev,title,next);panel.append(head);
 const grid=document.createElement('div');grid.className='month-grid';
 ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(day=>{const el=document.createElement('div');el.className='month-weekday';el.textContent=day;grid.append(el)});
 const year=monthCursor.getFullYear(),month=monthCursor.getMonth();
 const first=new Date(year,month,1,12).getDay(),days=new Date(year,month+1,0).getDate();
 for(let i=0;i<first;i++){const blank=document.createElement('div');blank.className='month-day empty';grid.append(blank)}
 for(let day=1;day<=days;day++){
  const date=new Date(year,month,day,12),dateKey=key(date),saved=records[dateKey]||{},isFuture=dateKey>key(today());
  const dayComplete=accounts.length>0&&accounts.every(account=>Array.isArray(saved[account.id])&&saved[account.id].length>=3&&saved[account.id].every(Boolean));
  const cell=document.createElement('button');cell.type='button';cell.disabled=isFuture;
  cell.className='month-day'+(dateKey===key(selected)?' selected':'')+(dateKey===key(today())?' today':'')+(isFuture?' future':dayComplete?' completed':' incomplete');
  const num=document.createElement('div');num.className='month-num';num.textContent=day;cell.append(num);
  if(!isFuture){const status=document.createElement('span');status.className='month-status';status.textContent=dayComplete?'✓':'✕';status.setAttribute('aria-label',dayComplete?'Completed':'Incomplete');cell.append(status)}

  if(!isFuture)cell.onclick=()=>{selected=date;showMonth=false;render()};
  grid.append(cell);
 }
 panel.append(grid);

}
function render(){
 const k=key(selected),d=current(),todayKey=key(today());
 renderMonth();
 document.getElementById('date').textContent=selected.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
 updateClock();
 document.getElementById('daylabel').textContent=k===todayKey?"Today's checklist":k<todayKey?'Previous day':'Future date';
 document.getElementById('next').disabled=k>=todayKey;
 const host=document.getElementById('accounts');host.replaceChildren();
 let completed=0,total=accounts.length*tasks.length;
 if(!accounts.length){const empty=document.createElement('div');empty.className='empty-accounts';empty.textContent='No accounts added yet. Select “Add account” to create your first profile.';host.append(empty)}
 accounts.forEach((account,index)=>{
  const section=document.createElement('section');section.className='account';
  const top=document.createElement('div');top.className='accounttop';
  const identity=document.createElement('div');identity.className='identity';
  identity.append(makePortrait(account.portrait,account.name));
  const meta=document.createElement('div');meta.className='accountmeta';
  const cap=document.createElement('div');cap.className='smallcap';cap.textContent='ACCOUNT '+String(index+1).padStart(2,'0');
  const heading=document.createElement('h2');heading.textContent=account.name;
  meta.append(cap,heading);identity.append(meta);
  const count=document.createElement('div');count.className='count';count.textContent=d[account.id].filter(Boolean).length+'/3';
  top.append(identity,count);section.append(top);
  const body=document.createElement('div');body.className='account-body';
  const taskHost=document.createElement('div');taskHost.className='tasks';
  tasks.forEach((task,i)=>{
   const label=document.createElement('label');label.className='task'+(d[account.id][i]?' done':'');
   const input=document.createElement('input');input.type='checkbox';input.checked=!!d[account.id][i];
   input.addEventListener('change',()=>{if(!records[k])records[k]=fresh();records[k][account.id][i]=input.checked;saveAll();render()});
   const span=document.createElement('span');span.textContent=task;label.append(input,span);taskHost.append(label);
  });
  body.append(taskHost);
  const n=d[account.id].filter(Boolean).length;completed+=n;
  const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=(n/3*100)+'%';bar.append(fill);taskHost.append(bar);
  const hoyo=document.createElement('div');hoyo.className='hoyo-box';
  const ht=document.createElement('div');ht.className='smallcap';ht.textContent='GENSHIN DAILY STATUS';hoyo.append(ht);
  const uidLabel=document.createElement('label');uidLabel.textContent='Genshin UID';hoyo.append(uidLabel);
  const uid=document.createElement('input');uid.inputMode='numeric';uid.placeholder='Enter this profile’s Genshin UID';uid.value=account.uid||'';uid.addEventListener('change',()=>{account.uid=uid.value.trim();saveAll()});hoyo.append(uid);
  const serverLabel=document.createElement('label');serverLabel.textContent='Genshin server';hoyo.append(serverLabel);
  const server=document.createElement('select');[['os_asia','Asia'],['os_usa','America'],['os_euro','Europe'],['os_cht','TW / HK / MO']].forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;server.append(o)});server.value=account.server||'os_asia';server.onchange=()=>{account.server=server.value;saveAll()};hoyo.append(server);
  const ha=document.createElement('div');ha.className='hoyo-actions';
  const connect=document.createElement('button');connect.className='btn';connect.textContent='Connect HoYoLAB';connect.onclick=async()=>{try{if(!window.tuskfizzy)throw new Error('HoYoLAB connection is available in the Windows desktop app.');await window.tuskfizzy.connectHoYoLab(account.id);hs.textContent='Sign in to HoYoLAB in the window that opened. Your session is saved separately for this profile.'}catch(e){hs.textContent=e.message}};
  const checkin=document.createElement('button');checkin.className='btn';checkin.textContent='Daily check-in';checkin.onclick=async()=>{try{if(!window.tuskfizzy)throw new Error('Open this in the Windows desktop app.');await window.tuskfizzy.openHoYoLabCheckin(account.id)}catch(e){hs.textContent=e.message}};
  const refresh=document.createElement('button');refresh.className='btn';refresh.textContent='Refresh';refresh.onclick=async()=>{try{if(!window.tuskfizzy)throw new Error('Open this in the Windows desktop app.');if(!account.uid)throw new Error('Enter the Genshin UID for this profile first.');hs.textContent='Loading HoYoLAB data…';const data=await window.tuskfizzy.getDailyNote(account.id,account.uid,account.server||'os_asia');account.hoyoData=data;account.hoyoUpdated=Date.now();const todayKey=key(today());if(!records[todayKey])records[todayKey]=fresh();const dayRecord=records[todayKey];if(!dayRecord._resinLast||typeof dayRecord._resinLast!=='object')dayRecord._resinLast={};const resinNow=Number(data.resin),resinPrevious=dayRecord._resinLast[account.id];if(Number.isFinite(resinNow)&&Number.isFinite(resinPrevious)&&resinPrevious>=50&&resinNow<50)dayRecord[account.id][2]=true;if(Number.isFinite(resinNow))dayRecord._resinLast[account.id]=resinNow;if(data.extraRewardClaimed===true)dayRecord[account.id][1]=true;saveAll();render()}catch(e){hs.textContent=e.message}};
  ha.append(connect,checkin,refresh);hoyo.append(ha);
  const hs=document.createElement('div');hs.className='hoyo-status';hs.textContent=account.hoyoUpdated?'Last refresh: '+new Date(account.hoyoUpdated).toLocaleString():'Connect HoYoLAB, then refresh your status.';hoyo.append(hs);
  if(account.hoyoData){
   const hd=account.hoyoData,details=document.createElement('div');details.className='hoyo-data';
   const stat=(value,label)=>{const item=document.createElement('div');item.className='hoyo-stat';const strong=document.createElement('strong');strong.textContent=value;const caption=document.createElement('span');caption.textContent=label;item.append(strong,caption);details.append(item)};
   stat(hd.resin+'/'+hd.maxResin,'Original Resin');
   stat(hd.commissions+'/'+hd.totalCommissions,'Daily Commissions');
   stat(hd.expeditions+'/'+hd.maxExpeditions,'Expeditions');
   stat(hd.extraRewardClaimed?'Claimed':'Not claimed','Commission bonus');
   hoyo.append(details);
  }else{const empty=document.createElement('div');empty.className='hoyo-empty';empty.textContent='Resin and commission progress will appear here after you connect HoYoLAB and press Refresh.';hoyo.append(empty)}
  body.append(hoyo);section.append(body);
  const actions=document.createElement('div');actions.className='account-actions';
  const edit=document.createElement('button');edit.className='btn';edit.textContent='Edit profile';edit.onclick=()=>editAccount(account.id);
  actions.append(edit);
  const upload=document.createElement('button');upload.className='btn';upload.textContent='Upload picture';
  upload.onclick=()=>{const picker=document.createElement('input');picker.type='file';picker.accept='image/*';picker.onchange=()=>{const file=picker.files&&picker.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');canvas.width=320;canvas.height=320;const ctx=canvas.getContext('2d');const scale=Math.max(320/img.width,320/img.height);const w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(320-w)/2,(320-h)/2,w,h);account.portrait=canvas.toDataURL('image/jpeg',0.8);saveAll();render()};img.src=reader.result};reader.readAsDataURL(file)};picker.click()};
  actions.append(upload);
  const remove=document.createElement('button');remove.className='btn danger';remove.textContent='Remove';remove.onclick=()=>removeAccount(account.id);actions.append(remove)
  section.append(actions);host.append(section);
 });
 document.getElementById('overallcount').textContent=completed+' of '+total+' completed';
 document.getElementById('percent').textContent=(total?Math.round(completed/total*100):0)+'%';
 document.getElementById('overallbar').style.width=(total?completed/total*100:0)+'%';
}
const profileDialog=document.getElementById('profileDialog');
let editingAccountId=null;
function openProfileDialog(id=null){
 editingAccountId=id;
 const account=id?accounts.find(a=>a.id===id):null;
 document.getElementById('profileDialogTitle').textContent=account?'Edit profile':'Add account';
 document.getElementById('profileName').value=account?account.name:'';
 document.getElementById('profileSave').textContent=account?'Save changes':'Add account';
 profileDialog.showModal();
 document.getElementById('profileName').focus();
}
function editAccount(id){openProfileDialog(id)}
document.getElementById('profileCancel').onclick=()=>profileDialog.close();
document.getElementById('profileForm').onsubmit=e=>{
 e.preventDefault();
 const name=document.getElementById('profileName').value.trim();
 if(!name)return;
 if(editingAccountId){
  const account=accounts.find(a=>a.id===editingAccountId);
  if(account){account.name=name}
 }else{
  const id='account_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
  accounts.push({id,name,portrait:''});
  Object.values(records).forEach(r=>r[id]=[false,false,false]);
 }
 saveAll();profileDialog.close();render();
};
function removeAccount(id){
 const account=accounts.find(a=>a.id===id);if(!account||!confirm('Remove '+account.name+' and its saved check-ins from this device?'))return;
 accounts=accounts.filter(a=>a.id!==id);Object.values(records).forEach(r=>delete r[id]);saveAll();render();
}
document.getElementById('addAccount').onclick=()=>openProfileDialog();
document.getElementById('prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()};
document.getElementById('next').onclick=()=>{if(key(selected)<key(today())){selected.setDate(selected.getDate()+1);render()}};
document.getElementById('today').onclick=()=>{selected=today();monthCursor=new Date(selected.getFullYear(),selected.getMonth(),1,12);showMonth=false;render()};
document.getElementById('monthToggle').onclick=()=>{showMonth=!showMonth;monthCursor=new Date(selected.getFullYear(),selected.getMonth(),1,12);render()};
document.getElementById('reset').onclick=()=>{if(confirm('Reset all account checkboxes for '+key(selected)+'?')){delete records[key(selected)];saveAll();render()}};
render();
setInterval(updateClock,1000);
setInterval(()=>{if(key(selected)===key(today()))render()},30000);
let installEvent;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;document.getElementById('install').style.display='block'});
document.getElementById('install').onclick=async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;installEvent=null;document.getElementById('install').style.display='none'};
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
