/* Genshin screens: compact, responsive layout */
.genshin-panel{min-height:0;overflow:hidden}

#genshinPanelBody>p{margin:8px 0 12px}
.genshin-form{min-height:0;margin:12px 0 16px;padding:14px}

}

 </form>
</dialog>

 const achievementRefreshes=new Map();
 async function refreshPublicAchievementCountOnce(accountItem,statusEl,force=false){
  if(!accountItem.uid){statusEl.textContent='Add this account UID to retrieve its public achievement count.';return}
  const ttl=Math.max(60,Number(accountItem.enkaProfile&&accountItem.enkaProfile.ttl)||300)*1000;
  const age=Date.now()-Number(accountItem.enkaProfile&&accountItem.enkaProfile.fetchedAt||0);
  if(!force&&accountItem.enkaProfile&&accountItem.enkaProfile.playerInfo&&age>=0&&age<ttl){
   const cachedCount=Number(accountItem.enkaProfile.playerInfo.finishAchievementNum);
   if(Number.isFinite(cachedCount)){
    if(!Array.isArray(accountItem.achievementCountHistory))accountItem.achievementCountHistory=[];
    const cachedHistory=accountItem.achievementCountHistory,last=cachedHistory[cachedHistory.length-1];
    if(!last||Number(last.count)!==cachedCount)cachedHistory.push({count:cachedCount,at:Number(accountItem.enkaProfile.fetchedAt)||Date.now()});
    accountItem.achievementCountHistory=cachedHistory.slice(-20);
    saveGenshinAccounts();
   }
   statusEl.textContent='Using Enka public profile cache · next refresh in about '+Math.ceil((ttl-age)/60000)+' min.';
   return;
  }
  statusEl.textContent='Refreshing public achievement count from Enka.Network…';
  try{
   let data;
   if(window.tuskfizzy&&typeof window.tuskfizzy.getEnkaProfile==='function')data=await window.tuskfizzy.getEnkaProfile(accountItem.uid);
   else{
    const response=await fetch('https://enka.network/api/uid/'+encodeURIComponent(accountItem.uid)+'/',{headers:{'Accept':'application/json'}});
    if(!response.ok)throw new Error('Enka.Network request failed ('+response.status+').');
    const raw=await response.json();
    if(!raw.playerInfo)throw new Error('No public player profile was returned.');
    data={uid:accountItem.uid,playerInfo:raw.playerInfo,avatarInfoList:Array.isArray(raw.avatarInfoList)?raw.avatarInfoList:[],ttl:Number(raw.ttl)||300,fetchedAt:Date.now(),cached:false};
   }
   if(!data||!data.playerInfo)throw new Error('Achievement count was not included in the public profile.');
   data.fetchedAt=data.fetchedAt||Date.now();
   accountItem.enkaProfile=data;accountItem.enkaUpdated=Date.now();
   const count=Number(data.playerInfo.finishAchievementNum);
   if(Number.isFinite(count)){
    if(!Array.isArray(accountItem.achievementCountHistory))accountItem.achievementCountHistory=[];
    const history=accountItem.achievementCountHistory,last=history[history.length-1];
    if(!last||Number(last.count)!==count)history.push({count,at:Date.now()});
    accountItem.achievementCountHistory=history.slice(-20);
   }
   saveGenshinAccounts();
   statusEl.textContent='Updated from Enka.Network · '+new Date().toLocaleString()+'.';
  }catch(error){
   statusEl.textContent='Could not refresh the public count: '+(error&&error.message?error.message:'unknown error')+'. Your last saved count is kept.';
  }
 }
 function refreshPublicAchievementCount(accountItem,statusEl,force=false){
  const key=String(accountItem.uid||'');
  if(achievementRefreshes.has(key))return achievementRefreshes.get(key);
  const task=refreshPublicAchievementCountOnce(accountItem,statusEl,force).finally(()=>achievementRefreshes.delete(key));
  achievementRefreshes.set(key,task);
  return task;
 }
 function getWishPools(){return {'100':'Beginner','200':'Standard','301':'Character Event','302':'Weapon Event','500':'Chronicled Wish'}}
 function extractUIGFAccount(data,expectedUid){
  if(data&&Array.isArray(data.hk4e)){
   let matches=data.hk4e;
   if(expectedUid)matches=matches.filter(x=>String(x.uid||'')===String(expectedUid));
   if(matches.length!==1)throw new Error(matches.length?'More than one Genshin account is in this file; select a file for one account.':'No Genshin records match the selected account UID.');
   return {uid:String(matches[0].uid||''),list:matches[0].list||[],version:data.info&&data.info.version||'UIGF 4+'};
  }
  if(data&&Array.isArray(data.list)){
   const uid=String((data.info&&data.info.uid)||data.uid||'');
   if(expectedUid&&uid&&uid!==String(expectedUid))throw new Error('This file belongs to UID '+uid+', but the selected account is UID '+expectedUid+'.');
   return {uid,list:data.list,version:(data.info&&(data.info.uigf_version||data.info.version))||'UIGF legacy'};
  }
  throw new Error('This is not a supported Genshin UIGF JSON file.');
 }
 function importUIGFWishes(accountItem,data){
  const source=extractUIGFAccount(data,accountItem.uid);
  if(source.uid&&accountItem.uid&&source.uid!==String(accountItem.uid))throw new Error('The UID in this file does not match the selected account.');
  const valid=source.list.filter(w=>w&&w.time&&w.item_id&&w.id&&w.gacha_type&&w.rank_type&&w.name);
  if(!valid.length)throw new Error('No valid Genshin wish records were found in this file.');
  const existing=Array.isArray(accountItem.wishHistory)?accountItem.wishHistory:[];
  const seen=new Set(existing.map(w=>String(w.id)));
  let added=0;
  valid.forEach(w=>{
   const rawType=String(w.gacha_type),poolType=String(w.uigf_gacha_type||({'400':'301'}[rawType]||rawType));
   if(!getWishPools()[poolType])return;
   const item={id:String(w.id),uid:source.uid,gacha_type:poolType,api_gacha_type:rawType,item_id:String(w.item_id),count:String(w.count||'1'),time:String(w.time),name:String(w.name),item_type:String(w.item_type||''),rank_type:String(w.rank_type)};
   if(!seen.has(item.id)){existing.push(item);seen.add(item.id);added++}
  });
  if(!added&&!existing.length)throw new Error('No supported Genshin banner types were found.');
  existing.sort((a,b)=>String(a.time).localeCompare(String(b.time))||String(a.id).localeCompare(String(b.id)));
  accountItem.wishHistory=existing;
  accountItem.wishHistoryImportedAt=Date.now();
  accountItem.wishHistorySource=source.version;
  saveGenshinAccounts();
  return {added,total:existing.length,ignored:valid.length-added};
 }
 function calculateWishPity(records){
  const ordered=records.slice().sort((a,b)=>String(a.time).localeCompare(String(b.time))||String(a.id).localeCompare(String(b.id)));
  let since5=0,since4=0;
  ordered.forEach(w=>{
   const rank=Number(w.rank_type);
   if(rank===5)since5=0;else since5++;
   if(rank===4||rank===5)since4=0;else since4++;
  });
  return {since5,since4,count:ordered.length};
 }

function exportLegacyData(){
 try{
  const cleanAccounts=accounts.map(a=>({id:String(a.id),name:String(a.name||'').slice(0,80),portrait:typeof a.portrait==='string'?a.portrait:'',genshinId:typeof a.genshinId==='string'?a.genshinId:null,createdAt:typeof a.createdAt==='string'?a.createdAt:''}));
  const cleanGenshin=genshinAccounts.map(g=>({id:String(g.id),name:String(g.name||'').slice(0,80),uid:String(g.uid||''),server:String(g.server||''),createdAt:typeof g.createdAt==='string'?g.createdAt:''}));
  const cleanDaily={};
  Object.entries(records).forEach(([day,profiles])=>{
   if(!/^20\d{2}-\d{2}-\d{2}$/.test(day)||!profiles||typeof profiles!=='object'||Array.isArray(profiles))return;
   const clean={};
   Object.entries(profiles).forEach(([id,flags])=>{
    if(id==='_resinLast'&&flags&&typeof flags==='object'&&!Array.isArray(flags)){clean._resinLast=flags;return}
    if(Array.isArray(flags)&&flags.length===3&&flags.every(value=>typeof value==='boolean'))clean[id]=flags;
   });
   cleanDaily[day]=clean;
  });
  const payload={format:'tuskfizzy-local-data',version:1,exportedAt:new Date().toISOString(),accounts:cleanAccounts,dailyRecords:cleanDaily,genshinAccounts:cleanGenshin,selectedGenshinId:genshinAccounts.some(g=>g.id===selectedGenshinId)?selectedGenshinId:''};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download='tuskfizzy-local-data.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  document.getElementById('saved').textContent='✓ Exported profiles and checklist history';
 }catch(error){document.getElementById('saved').textContent='Export failed — '+(error&&error.message?error.message:'storage unavailable')}
}

  const refresh=document.createElement('button');refresh.className='btn';refresh.textContent='Refresh';refresh.onclick=async()=>{try{if(!window.tuskfizzy)throw new Error('Open this in the Windows desktop app.');const targetUid=account.uid||(linkedGenshin&&linkedGenshin.uid);if(!targetUid)throw new Error('Enter the Genshin UID for this profile first.');hs.textContent='Loading HoYoLAB data…';const data=await window.tuskfizzy.getDailyNote(linkedGenshin?linkedGenshin.id:account.id,targetUid,account.server||(linkedGenshin&&linkedGenshin.server)||'os_asia');if(linkedGenshin){linkedGenshin.dailyNote=data;linkedGenshin.lastConnected=Date.now();account.dailyNote=data}else{account.hoyoData=data;account.hoyoUpdated=Date.now()}const todayKey=key(today());if(!records[todayKey])records[todayKey]=fresh();const dayRecord=records[todayKey];if(!dayRecord._resinLast||typeof dayRecord._resinLast!=='object')dayRecord._resinLast={};const resinNow=Number(data.resin),resinPrevious=dayRecord._resinLast[account.id];if(Number.isFinite(resinNow)&&Number.isFinite(resinPrevious)&&resinPrevious>=50&&resinNow<50)dayRecord[account.id][2]=true;if(Number.isFinite(resinNow))dayRecord._resinLast[account.id]=resinNow;if(data.extraRewardClaimed===true)dayRecord[account.id][1]=true;saveAll();if(linkedGenshin)saveGenshinAccounts();render()}catch(e){hs.textContent=e.message}};
  ha.append(connect,checkin,refresh);hoyo.append(ha);
  const hs=document.createElement('div');hs.className='hoyo-status';hs.textContent=(linkedGenshin?linkedGenshin.lastConnected:account.hoyoUpdated)?'Last refresh: '+new Date(linkedGenshin?linkedGenshin.lastConnected:account.hoyoUpdated).toLocaleString():'Connect HoYoLAB, then refresh your status.';hoyo.append(hs);

}
const profileDialog=document.getElementById('profileDialog');
let editingAccountId=null;
function openProfileDialog(id=null){
 editingAccountId=id;
 const account=id?accounts.find(a=>a.id===id):null;
 document.getElementById('profileDialogTitle').textContent=account?'Edit profile':'Add account';
 document.getElementById('profileName').value=account?account.name:'';
 document.getElementById('profileSave').textContent=account?'Save changes':'Add account';
 profileDialog.showModal();
 document.getElementById('profileName').focus();
}
function editAccount(id){openProfileDialog(id)}
document.getElementById('profileCancel').onclick=()=>profileDialog.close();
document.getElementById('profileForm').onsubmit=e=>{
 e.preventDefault();
 const name=document.getElementById('profileName').value.trim();
 if(!name)return;
 if(editingAccountId){
  const account=accounts.find(a=>a.id===editingAccountId);
  if(account){account.name=name}
 }else{
  const id='account_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
  accounts.push({id,name,portrait:''});
  Object.values(records).forEach(r=>r[id]=[false,false,false]);
 }
 saveAll();profileDialog.close();render();
};
function removeAccount(id){
 const account=accounts.find(a=>a.id===id);if(!account||!confirm('Remove '+account.name+' and its saved check-ins from this device?'))return;
 accounts=accounts.filter(a=>a.id!==id);Object.values(records).forEach(r=>delete r[id]);saveAll();render();
}
document.getElementById('prev').onclick=()=>{selected.setDate(selected.getDate()-1);render()};
document.getElementById('next').onclick=()=>{if(key(selected)<key(today())){selected.setDate(selected.getDate()+1);render()}};
document.getElementById('today').onclick=()=>{selected=today();monthCursor=new Date(selected.getFullYear(),selected.getMonth(),1,12);showMonth=false;render()};
document.getElementById('monthToggle').onclick=()=>{showMonth=!showMonth;monthCursor=new Date(selected.getFullYear(),selected.getMonth(),1,12);render()};
document.getElementById('exportLegacy').onclick=exportLegacyData;
document.getElementById('reset').onclick=()=>{if(confirm('Reset all account checkboxes for '+key(selected)+'?')){delete records[key(selected)];saveAll();render()}};
updateClock();
setInterval(updateClock,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock()});
window.addEventListener('pageshow',updateClock);
render();
setInterval(()=>{if(key(selected)===key(today()))render()},30000);
let installEvent;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;document.getElementById('install').style.display='block'});
document.getElementById('install').onclick=async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;installEvent=null;document.getElementById('install').style.display='none'};
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
